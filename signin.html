<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/signin.css" />
  </head>
  <body class="bg-light">
    <!-- Header -->
    <header
      class="bg-white shadow-sm p-3 d-flex justify-content-between align-items-center"
    >
      <h5 class="m-0">Musicore</h5>
      <a href="#" class="text-dark text-decoration-none">My Account</a>
    </header>

    <!-- Main container -->
    <div
      class="container d-flex justify-content-center align-items-center"
      style="min-height: 85vh"
    >
      <div
        class="card shadow p-4"
        style="max-width: 500px; width: 100%; border-radius: 12px"
      >
        <div class="text-center mb-4">
          <h2 class="mb-1">Sign Up</h2>
          <p class="text-muted">Create your account</p>
        </div>

        <form>
          <!-- First + Last name row -->
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="firstname" class="form-label">First Name</label>
              <input
                type="text"
                class="form-control"
                id="firstname"
                placeholder="First name"
                required
              />
            </div>

            <div class="col-12 col-md-6">
              <label for="lastname" class="form-label">Last Name</label>
              <input
                type="text"
                class="form-control"
                id="lastname"
                placeholder="Last name"
                required
              />
            </div>
          </div>

          <!-- Email -->
          <div class="mt-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <!-- Password -->
          <div class="mt-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Create a password"
              required
            />
            <div class="form-text">Password must be at least 8 characters</div>
          </div>

          <!-- Button -->
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">
              Create Account
            </button>
          </div>
        </form>

        <div class="text-center mt-3">
          <small>
            Already have an account?
            <a href="#" class="text-primary text-decoration-none">Log in</a>
          </small>
        </div>
      </div>
    </div>
  </body>
</html>
