<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <!-- Header -->
    <header
      class="bg-white p-3 d-flex justify-content-between align-items-center"
    >
      <h5 class="m-0">Musicore</h5>
      <a href="#" class="text-dark text-decoration-none">My Account</a>
    </header>

    <!-- Main container -->
    <div
      class="container d-flex justify-content-center align-items-center"
      style="min-height: 85vh"
    >
      <div
        class="card shadow p-4"
        style="max-width: 450px; width: 100%; border-radius: 12px"
      >
        <div class="text-center mb-4">
          <h2 class="mb-1">Welcome back!</h2>
          <p class="text-muted">Please log in to continue</p>
        </div>

        <form>
          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              required
            />

            <div class="form-text text-danger">Invalid email or password</div>

            <div class="text-end mt-2">
              <a href="#" class="small text-decoration-none">
                Forgot password?
              </a>
            </div>
          </div>

          <!-- Button -->
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">Log in</button>
          </div>
        </form>

        <div class="text-center mt-3">
          <small>
            Not signed up?
            <a href="signin.html" class="text-primary text-decoration-none"> Sign up </a>
          </small>
        </div>
      </div>
    </div>
  </body>
</html>
